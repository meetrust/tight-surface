<!-- @dsCard group="Motion" height=250 subtitle="全页暂停：一个按钮停住页面上所有持续的动效" -->
<div style="padding:24px;max-width:680px;display:grid;gap:12px">
  <!-- @license lucide-static v1.71.0 - ISC -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></symbol>
  </svg>
  <div style="display:flex;justify-content:flex-end"><button class="act motion-pause" type="button" data-motion-pause><svg class="i" aria-hidden="true"><use href="#i-pause"/></svg><span>暂停动画</span></button></div>
  <figure class="fig">
    <figcaption><b>FIG.01 · 请求流向</b><span>虚线流动表示正在传输</span></figcaption>
    <div class="fig-body">
      <div style="display:grid;grid-template-columns:auto minmax(24px,1fr) auto minmax(24px,1fr) auto;align-items:center;gap:8px">
        <span class="lvl" style="--c: var(--l1)">客户端</span>
        <svg width="100%" height="8" aria-hidden="true"><line class="flowing" x1="0" y1="4" x2="100%" y2="4" stroke="var(--amber)" stroke-width="2"/></svg>
        <span class="lvl" style="--c: var(--l2)">路由</span>
        <svg width="100%" height="8" aria-hidden="true"><line class="flowing" x1="0" y1="4" x2="100%" y2="4" stroke="var(--amber)" stroke-width="2"/></svg>
        <span class="lvl" style="--c: var(--l6)">模型</span>
      </div>
    </div>
  </figure>
</div>
<script>
(() => {
  // 全页暂停：切换 html[data-motion="paused"]（CSS 动画随之暂停），并广播 ts:motion 给脚本驱动的循环
  const html = document.documentElement;
  const btn = document.querySelector("[data-motion-pause]");
  const icon = btn.querySelector("use"), label = btn.querySelector("span");
  const render = () => {
    const paused = html.dataset.motion === "paused";
    icon.setAttribute("href", paused ? "#i-play" : "#i-pause");
    label.textContent = paused ? "继续动画" : "暂停动画";
  };
  btn.addEventListener("click", () => {
    if (html.dataset.motion === "paused") delete html.dataset.motion; else html.dataset.motion = "paused";
    render();
    window.dispatchEvent(new CustomEvent("ts:motion", { detail: { paused: html.dataset.motion === "paused" } }));
  });
  render();
})();
</script>
