<!-- @dsCard group="Agent" height=450 subtitle="人工确认卡：单选方案 + 置信度 + 跳过 / 确认" -->
<div style="padding:24px;max-width:640px">
  <form class="approve" aria-labelledby="ap-q" onsubmit="return false">
    <div class="approve-head"><p class="eyebrow">NEEDS APPROVAL</p><span class="approve-step">1 / 3</span></div>
    <p class="approve-q" id="ap-q">下月预算会超出 12%，要切换到哪种路由策略？</p>
    <fieldset class="approve-opts">
      <legend class="sr-only">路由策略</legend>
      <label class="opt"><input type="radio" name="route" value="sonnet" checked><span><b>长上下文请求改走 Sonnet</b><small>预计节省 9%，对回答质量影响最小</small></span><span class="opt-conf">置信度 82%</span></label>
      <label class="opt"><input type="radio" name="route" value="cap"><span><b>所有请求设置每日上限</b><small>预算可控，但高峰期会排队</small></span><span class="opt-conf">置信度 64%</span></label>
      <label class="opt"><input type="radio" name="route" value="keep"><span><b>维持现状</b><small>超支部分计入下月预算</small></span><span class="opt-conf">置信度 41%</span></label>
    </fieldset>
    <div class="approve-foot">
      <button class="act ghost" type="button">跳过</button>
      <button class="act" type="button">查看依据</button>
      <button class="act primary" type="submit">确认</button>
    </div>
  </form>
</div>
