<script>
(() => {
  // 实时计时：运行中的工具每个 tick 刷新一次耗时；减弱动效、全页暂停或页面在后台时每秒一次
  const css = getComputedStyle(document.documentElement);
  const ms = (n) => { const v = css.getPropertyValue(n).trim(); return v.endsWith("ms") ? parseFloat(v) : parseFloat(v) * 1000; };
  const TICK = ms("--tick");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const slow = () => reduce.matches || document.hidden || document.documentElement.dataset.motion === "paused";
  const out = document.querySelector('[data-tool-demo] .tool[data-state="running"] .ms');
  const start = performance.now() - parseFloat(out.textContent) * 1000;
  let shown = -Infinity;
  const loop = () => {
    const now = performance.now();
    if (!slow() || now - shown >= 1000) { shown = now; out.textContent = ((now - start) / 1000).toFixed(1) + " s"; }
    setTimeout(loop, TICK);
  };
  loop();
})();
</script>
