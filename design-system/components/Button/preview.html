<!-- @dsCard group="Actions" height=220 -->
<div style="padding:24px;display:grid;gap:20px">
  <!-- @license lucide-static v1.71.0 - ISC -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></symbol>
    <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></symbol>
  </svg>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
    <a class="btn video" href="#" onclick="return false"><span class="ic"><svg class="i" aria-hidden="true"><use href="#i-play"/></svg></span><span class="lbl">课程视频<small>YouTube 播放列表</small></span><span class="ext"><svg class="i" aria-hidden="true"><use href="#i-arrow-up-right"/></svg></span></a>
    <a class="btn" href="#" onclick="return false"><span class="ic"><svg class="i" aria-hidden="true"><use href="#i-code"/></svg></span><span class="lbl">GitHub 仓库<small>作业与笔记</small></span><span class="ext"><svg class="i" aria-hidden="true"><use href="#i-arrow-up-right"/></svg></span></a>
    <span class="btn off" aria-disabled="true"><span class="ic"><svg class="i" aria-hidden="true"><use href="#i-code"/></svg></span><span class="lbl">暂无公开链接<small>仅视频</small></span></span>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <button class="act primary" type="button">保存</button>
    <button class="act" type="button"><svg class="i" aria-hidden="true"><use href="#i-download"/></svg>导出 CSV</button>
    <button class="act ghost" type="button">取消</button>
    <button class="act danger" type="button">删除模块</button>
    <button class="act" type="button" disabled>已提交</button>
    <button class="act sm" type="button">重试</button>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <button class="fbtn" type="button" aria-pressed="true">全部</button>
    <button class="fbtn" type="button" aria-pressed="false">基础</button>
    <button class="fbtn" type="button" aria-pressed="false">视觉</button>
    <button class="copy" type="button">复制</button>
    <button class="copy ok" type="button">已复制</button>
  </div>
</div>
